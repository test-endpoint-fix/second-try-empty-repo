apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    steps:
      - name: Get source Code
        uses: cloudbees-io/checkout@v1

      - name: Setup git credentials
        uses: cloudbees-io/configure-git-global-credentials@v1  

      - id: build
        name: Build using the shared action
        uses: calculi-corp/cb-internal-shared-actions/build@v9
        with:
          run-unit-test: "true"
          snyk-sast-scan-code: "true"
          go-binary-build: "true"
          go-binary-name: my-go-app


