apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    steps:
      - name: Get source Code
        uses: cloudbees-io/checkout@v1  

      - id: build
        name: Build
        uses: docker://golang:1.27.3
        run: |
          go build -v ./...

      - name: Run tests
        uses: docker://golang:1.27.3
        run: |
          go test -v ./...


